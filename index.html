    <script>
      (function() {
        try {
          var mode = localStorage.getItem('bella_theme_mode') || 'auto';
          var saved = localStorage.getItem('bella_theme');
          var theme = saved;
          if (mode === 'auto' || !theme) {
            var hour = new Date().getHours();
            theme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
